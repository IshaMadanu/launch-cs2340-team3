{% extends 'base.html' %}
{% block content %}
{% load static %}
<div class="p-3">
  <div class="container">
    <div class="row mt-3">
      <div class="col-md-6 mx-auto mb-3">
        <h2>{{ template_data.job.title }}</h2>
        <hr />
        <p><b>Description:</b> {{template_data.job.description }}</p>
        <p><b>Salary:</b> ${{template_data.job.salary }}</p>
        {% if user.is_authenticated %}
          <form method="POST"
                action="{% url 'jobs.add_to_cart' template_data.job.id %}">
            {% csrf_token %}

            <button type="submit" class="btn btn-primary">
              Add to Cart
            </button>
          </form>
        {% endif %}
      </div>
      <div class="col-md-6 mx-auto mb-3 text-center">
        <img src="{{ template_data.job.image.url }}" class="rounded img-card-400" />
      </div>
    </div>
  </div>
</div>
{% endblock content %}
